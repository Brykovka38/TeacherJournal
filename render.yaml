services:
  - type: web
    name: teacher-journal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: AUTH_USER
        value: teacher
