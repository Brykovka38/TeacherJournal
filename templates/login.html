<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Вход · Журнал преподавателя</title><link rel="stylesheet" href="/static/style.css">{% include "pwa_head.html" %}</head><body><main style="max-width:460px;margin:8vh auto;padding:16px"><section class="panel"><h1>Журнал преподавателя</h1><p>Вход в личный кабинет</p>{% if error %}<p role="alert">{{error}}</p>{% endif %}<form method="post" action="/login" class="fields"><label>Логин<input name="login" autocomplete="username" required></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><button>Войти</button></form></section></main></body></html>
